description: 'v054 EXACTLY with ONE change: optim.grad_clip 1.0 -> 5.0. The optimiser
  has never been varied in this project -- across 57 versions lr, weight_decay, grad_clip
  and schedule were all fixed. This opens that surface. Graded against wunderfund''s
  best config (97 submissions).'
hypothesis: 'Unclip the update. Measured over 1,917 logged steps: median grad_norm
  0.702, with 25.8% of steps exceeding the current clip of 1.0 and only 0.5% exceeding
  5.0. So today roughly a quarter of all updates are rescaled by 1/||g||, which makes
  the EFFECTIVE learning rate wobble step to step instead of tracking the nominal
  2e-3. wunderfund''s best ran at 5.0. Prediction: small, possibly +/-0.0002. The
  point is that it is a free, single-knob change to a surface never varied in 57 versions.'
change_vs_parent: 'vs v054: optim.grad_clip 1.0 -> 5.0. Nothing else -- features,
  model, loss, schedule, seed and state_reset are identical.'
