  v059. The public figure is EXACTLY the size of this project''s measured public seed
  noise (~0.0004), so the gain and the noise are indistinguishable from the board
  alone. A seed replicate is the only clean way to separate them: v050 (v042''s recipe
  at seed 1338) established the floor by reproducing its parent''s public score to
  within 0.0001, which is what makes a single replicate informative rather than merely
  suggestive.'
