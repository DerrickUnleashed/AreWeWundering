schema_version: 1
identity:
  model: gru
  version: v001
  parent: gru_v000
  status: planned
description: 'WIDE: 1 layer x 256 units, otherwise identical to gru_v000''s recipe.'
hypothesis: 'At roughly equal inference latency, width should buy more than depth
  for a tail-weighted global correlation: the same parameter budget concentrated in
  one wider layer gives each step a longer memory per gate.'
change_vs_parent: model.hidden 128->256 and model.layers 2->1. Single variable. Trained
  on all 10,607 sequences for 3 epochs, seed 1337, evaluated on the same fixed 200
  validation sequences as the other three runs.
data:
