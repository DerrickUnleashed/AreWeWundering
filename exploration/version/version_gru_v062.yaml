description: 'v054 with the THREE sweep winners stacked: lr 0.002->0.001 (v059), training.state_reset
  4000->10000 (v055), grad_clip 1.0->5.0 (v057). These were the top three runs of
  the seven-run sweep on the OFFICIAL full_valid_wp metric AND on the public board,
  in the same order. They are three independent axes -- learning rate, training horizon,
  gradient clipping -- not three views of one change, so composition is plausible
  rather than double-counting.'
hypothesis: If the three gains compose additively, full_valid_wp reaches 0.689332,
  i.e. +0.001181 = +7.4 sigma over v054, which on this sweep's measured calibration
  (Spearman +0.893 with public, and v059's +0.000524 local arriving as a tie with
  the best public score) implies a public score around 0.661. That would beat 0.6600.
change_vs_parent: 'vs v054: optim.lr 0.002->1e-3, optim.grad_clip 1.0->5.0, training.state_reset
  4000->10000. Everything else identical -- features, model, loss (distill_weight
  2.0, three-member teacher), weight_decay 0.01, cosine schedule, 3 epochs, seed 1337.
  inference.state_reset stays 4000 so SERVING is unchanged from v042/v054 and only
  the training horizon moves.'
