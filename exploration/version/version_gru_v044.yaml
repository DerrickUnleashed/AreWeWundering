description: v039 with epochs 3 -> 8 AND distill_weight 2.0 -> 3.0, stacking the two changes that individually produced our two best public runs.
hypothesis: Deliberately the aggressive corner of the 2x2 that v040 and v041 probe one axis at a time, so that if the stack wins we ship it and if it loses we still know which axis broke it. Both axes moved the score in the same direction at dw 2.0, and v043 in this same batch is the control that tells us whether the teacher pair needs a third member.
