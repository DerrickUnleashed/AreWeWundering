description: 'v056 EXACTLY with ONE change: model.head_activation gelu -> relu. v056
  is the reference because it is the only model in the project with a real multi-layer
  GELU head, so the activation is a genuine A/B rather than a comparison against a
  plain Linear readout.'
hypothesis: 'The cleanest single-knob test available: a one-word change that alters
  the head''s nonlinearity and NOTHING else -- same parameter count, same shapes,
  same FLOPs, same latency. 35 of 56 models here used GELU; wunderfund''s best used
  ReLU. If activation choice is worth anything, this isolates it with capacity held
  exactly fixed, which no architecture change in this project has managed to do.'
change_vs_parent: 'vs v056: model.head_activation gelu -> relu. Nothing else. Parameter
  count and measured latency are identical; only the head nonlinearity differs.'
