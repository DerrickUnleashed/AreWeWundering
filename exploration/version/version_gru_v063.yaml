  status: finished
description: 'v059 (lr 1e-3 -- the single best lever in the project, full_valid_wp
  0.688676, public 0.6600) with ONE change: model.layers 2 -> 1. Branched from v059
  rather than from v060 so the capacity change is measured against our strongest model,
  not against the baseline.'
hypothesis: A single-layer GRU captures the score of a two-layer one at 56% of the
  parameters and ~80% of the latency. v060 (1 layer, lr 0.002) scored 0.686824 officially
  but 0.6591 publicly and ran in 38m11s = 64% of budget, the fastest of the whole
  sweep. If the capacity gain and the step-size gain sit on DIFFERENT axes -- which
  is the reason this is worth running after v062 showed that three step-size levers
  collapsed into one -- then v063 should land near v059's 0.688676 while serving in
  roughly 31 us/row.
change_vs_parent: 'vs v059: model.layers 2 -> 1. Nothing else -- optim (lr 1e-3, wd
  0.01, grad_clip 1.0), features, loss, distillation, schedule, 3 epochs, seed and
  state_reset all identical. 225,922 -> 126,850 params expected.'
