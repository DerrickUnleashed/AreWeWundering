  parent: gru_v031
  status: finished
description: 'v031''s exact recipe with ONE change: AdamW weight_decay 0.01 -> 0.03.
  Model, teacher, distill_weight, schedule, LR and seed all unchanged.'
hypothesis: "A direct test of the DIAGNOSIS behind three failed capacity runs. Bigger\
  \ models lost monotonically -- head -3.2 sigma, hidden 285 -13.7, hidden 415 -21.7.\
  \ The standard reading is that extra capacity here is absorbed as overfitting rather\
  \ than used. If that reading is right, more regularisation should HELP at the current\
  \ size, and we have never tested it: weight_decay has sat at 0.01 and dropout at\
  \ 0.0 since v011.\n\n  This is the one experiment that could make the capacity results\
  \ look different rather than just confirming them. If heavier decay improves 225,922\
  \ params, then the trunk widenings were unregularised rather than wrong, and v026/v027\
  \ might be recoverable. If it does nothing, the capacity losses were not an overfitting\
  \ signature at all and the diagnosis in those three commit messages is wrong.\n\n\
  \  3x is large enough to see an effect and small enough to stay in the regime AdamW\
  \ handles well. dropout is deliberately NOT also changed -- two knobs at once would\
  \ make a null unreadable."
change_vs_parent: optim.weight_decay 0.01 -> 0.03 only. dropout stays 0.0 so this
  isolates the decay term.
