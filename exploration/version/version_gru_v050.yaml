description: v042's EXACT recipe at seed 1338 instead of 1337. A control, not an attempt
  to improve the score.
hypothesis: 'We currently cannot tell a real +0.0003 from noise. Six submissions of
  the same recipe family spanned 0.6593 to 0.6600 publicly, and excluding one outlier
  the local-to-public correlation is -0.13, so the two metrics disagree about ordering
  inside the noise band. Before we can interpret v046 to v049 we need to know how
  big the seed-to-seed spread is on the PUBLIC board. This measures it directly: same
  config, same teacher, one variable changed, submitted. Without this control, none
  of the other four runs can be called a win.'
