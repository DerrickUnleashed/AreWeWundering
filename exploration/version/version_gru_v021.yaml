schema_version: 1
identity:
  model: gru
  version: v021
  parent: gru_v017
  status: planned
description: dozken's reset2k architecture, trained on our own data. 2x192 GRU with a 64-unit GELU+LayerNorm
  input projection over concat[normalised, first differences] (224), a skip from that projection into
  a 256-unit MLP head, and periodic state reset every 2,000 rows. 435,714 params, matching the public
  0.6569 model structurally but with none of its weights.
hypothesis: Our base is 0.0054 behind his at the base (v011 0.6515 vs his 0.6569) while we gained MORE
  from distillation than he did (+0.0027 vs +0.0019), so the deficit is entirely in the base architecture,
  not in the distillation process. His base is 435k params at 92-100% of the latency budget; ours is 192k
  at 43-52%. If capacity and these three structural additions (input projection, projection-to-readout
  skip, MLP head) are the cause, this closes the gap using only our own data.
change_vs_parent: 'Architecture only. v017 -> v021: hidden 96 -> 192, input_proj 0 -> 64, linear head
  -> LayerNorm + 256-unit GELU MLP head over concat[h2, projection], first_differences [] -> all 112 columns,
  normalisation none -> robust_zscore with clip_sigma 10 (his clip bound), state_reset 4000 -> 2000 (his
  grid). Loss, optimiser and data are unchanged.'
