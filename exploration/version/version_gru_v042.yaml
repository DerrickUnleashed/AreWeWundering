description: 'v039 with a THREE-member teacher: dozken reset2k + reset4k plus our
  own v037 replayed over the full training set.'
hypothesis: Teacher identity is the ONLY lever out of five that produced a top result,
  so it is the one worth pushing hardest. v039 gained +0.000836 local / +0.0007 public
  going from one teacher to two, so the direction is confirmed rather than speculative.
  The third member is v037, a DIFFERENT model on a DIFFERENT schedule (8 epochs) scoring
  0.6592 publicly, so it is genuinely decorrelated from dozken rather than a near-duplicate
  -- exactly the lesson from v023, where an ensemble of two models trained the same
  way contributed nothing (-0.000174) because the members were not actually diverse.
change_vs_parent: loss.teacher_labels gains a third path. Same averaging path as v039.
