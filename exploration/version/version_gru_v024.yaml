description: Distilled student on dozken's architecture at v022's exact size (hidden 160, 321,602 params),
  but trained with batch_sequences 64 instead of 16 -- the batch size his own notes cite. Same teacher,
  same model, same loss; the training regime is the only change.
hypothesis: 'The 0.0116 between v021 (his architecture, our recipe, 0.678575) and his own model (same
  architecture, 0.690168) is in his TRAINING, not his network. His notes cite batch 64, chunk 1000, 5
  epochs; we use chunk 1000 but batch 16. A 4x larger batch changes the gradient noise scale, and for
  a tail-weighted global Pearson objective that plausibly matters a lot. If the missing 0.0116 is anywhere
  we can reach, it is here. v023 and v024 are independent: one tests the student size, this one tests
  the regime.'
change_vs_parent: batch_sequences 16 -> 64 only. Same hidden 160, same teacher, same loss, same 3 epochs.
  Total samples and total compute are unchanged; only the batch geometry differs. Steps per epoch fall
  4x (13,259 -> 3,315) because a step consumes one chunk per lane.
