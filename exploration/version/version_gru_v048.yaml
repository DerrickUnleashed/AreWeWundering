description: v042 with training.state_reset 2000 -> 8000, so the train/serve gap reverses direction.
hypothesis: 'If v042''s advantage is the mismatch itself rather than the serving horizon, then a BIGGER gap pointing the other way should help more: train at 8000, serve at 4000, so the model learns long-range dynamics and is served a shorter slice of them. If instead the gain is purely from serving at 4000, this will lose to v042. Together with v042 (2000/4000) and v047 (4000/4000) this is a three-point sweep on the train/serve horizon gap, and it is the first time anyone has probed that axis at all.'
change_vs_parent: training.state_reset 2000 -> 8000. inference.state_reset unchanged at 4000. chunk_len stays 1000 so resets still land on chunk boundaries.
