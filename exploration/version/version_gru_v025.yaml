  parent: gru_v023
  status: finished
description: 'v023''s exact recipe (hidden 128, 225,922 params, his architecture,
  his model as teacher) with his FULL training schedule: batch 64 and 5 epochs instead
  of 3. Two variables changed from v023, both from his notes, and both now affordable
  because batch 64 trains 2.2x faster than batch 16.'
hypothesis: The one lever we have never combined with distillation is EPOCH COUNT
  on top of his cited batch size. v022/v023 ran 3 epochs; his notes say 5. Everything
  else is v023, which is our best entry (0.6568 public) and which the public board
  showed is TIED with the 42%-larger v022, so student size is settled and is not where
  the remaining 0.0109 to 0.6711 lives. This tests whether training LONGER on the
  same teacher closes any of it, at a cost of ~2.5 h rather than the ~8 h it would
  have taken before the batch-64 speedup.
change_vs_parent: batch_sequences 16 -> 64 and epochs 3 -> 5. Same hidden 128, same
  teacher, same loss, same chunk_len 1000, same state_reset 2000. Two variables, both
  from his cited recipe, deliberately combined rather than split because this is the
  last cheap test of that recipe end to end and the latency headroom now makes it
  affordable in a single run.
