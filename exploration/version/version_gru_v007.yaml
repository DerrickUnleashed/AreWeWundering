description: 'INPUTS: first differences of the i0 top-of-book prices and the trade
  features.'
hypothesis: LOB prediction is dominated by short-horizon dynamics, and the features
  are snapshot levels. First differences give the model velocity/flow information
  it cannot recover from levels alone. Costs no extra inference FLOPs once folded
  into layer 1.
change_vs_parent: features.first_differences [] -> the 30 indices of the i0 price
  block (0-21) and i0 trade block (44-51). Single variable off gru_v002.
