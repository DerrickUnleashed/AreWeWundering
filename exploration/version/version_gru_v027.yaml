description: 'v026 at 2x again: hidden 415, 1,742,717 params. That is 2.00x v026 (871,977),
  4.00x the 435,943-param teacher, and 4.00x the largest model we ran before v026.
  Everything else identical to v026 and v023: same architecture, same teacher, same
  distill_weight 0.5, same loss, same batch 16, 3 epochs, chunk 1,000, state reset
  every 2,000.'
hypothesis: 'RUN AGAINST THE EVIDENCE, deliberately, at the user''s direction. Two
  independent signs say size past ~436k does not help: dozken''s own table shows his
  872k TWO-GRAPH teacher scored 0.6879, identical to his 436k single-graph student,
  while his SMALLEST model (314k) is his BEST at 0.6888; and our own submissions rank
  226k (0.6568) above both 322k models (0.6565, 0.6560). If capacity were the binding
  constraint on our 0.005 gap to the teacher, this should close it at 400% of the
  teacher''s size. It is expected NOT to, and that negative result is the point: it
  would show the ceiling is the teacher''s knowledge rather than the student''s capacity,
  which is the claim the next round of work rests on. Nothing at this size can be
  shipped -- ~69 us/row on the fused path at v026 already projects past the grader''s
  60-min target, and this is 2x that.'
change_vs_parent: hidden 285 -> 415 ONLY. 871,977 -> 1,742,717 params. Nothing else
  moves.
