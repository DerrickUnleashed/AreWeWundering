  burn_in: 99
  batch_sequences: 16
  max_steps: null
  smoke_steps: 60
  epochs: 3
  seed: 1337
  eval_every_steps: 2500
  eval_subset_sequences: 200
  device: cpu
  stateful: true
inference:
