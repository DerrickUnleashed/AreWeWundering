schema_version: 1
identity:
  model: gru
  version: v009
  parent: gru_v002
  status: running
description: 'INPUTS: append sign(x)*log1p(|x|) of every feature, to compress the
  heavy tails.'
hypothesis: 'The features saturate near +-2.33 and carry a -5.199 floor sentinel,
  so the distribution is heavy-tailed. A signed-log copy gives the model a compressed
  view of the same information, which is often easier to fit for a tail-weighted metric.
  NOTE: the template applies this to ALL 112 columns, not a selectable subset.'
change_vs_parent: features.signed_log_volumes false -> true (appends 112 signed-log
  columns). Single variable off gru_v002.
data:
  train_shards: cache/train
  valid_shards: cache/valid
  seq_len: 20000
  warmup_steps: 99
  target_clip: 2.0
  train_sequences: null
features:
  normalisation: robust_zscore
  signed_log_volumes: true
  first_differences: []
  cross_instrument: []
  step_feature: false
  clip_sigma: 8
model:
  arch: gru
  input_proj: 0
  hidden: 128
  layers: 2
  dropout: 0.0
  layernorm: false
  head: linear
  param_count: 235266
loss:
  type: seq_weighted_pearson
  mask: soft
  aux_mse_weight: 0.0
  target_clip: 2.0
optim:
