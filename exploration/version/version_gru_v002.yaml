description: 'INPUTS: train-only robust z-score with +-8 sigma clipping, on top of
  the organiser-standardised features.'
hypothesis: The organisers standardise globally rather than per-window, so re-standardising
  on train statistics and clipping the tails should add information the model currently
  cannot see. Costs 4.3 us/row at inference, well inside budget.
change_vs_parent: features.normalisation none->robust_zscore and features.clip_sigma
  0->8. Single variable. Trained on all 10,607 sequences for 3 epochs, seed 1337,
  evaluated on the same fixed 200 validation sequences.
