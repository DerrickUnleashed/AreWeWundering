schema_version: 1
identity:
  model: gru
  version: v013
  parent: gru_v011
  status: running
description: 'Single-variable follow-up to v011: identical except the soft mask is removed.
  Keeps the periodic state reset at 4,000 and drops only the P(is_scored) loss weighting.'
hypothesis: v011 moved full_valid_wp from 0.674179 (3-seed mean) to 0.679986, +0.0058 at 36
  sigma, but it changed the mask AND the reset together, so the gain is unattributed. This
  run isolates them. If it lands near 0.674 the soft mask did the work and the reset is inert;
  if near 0.680 the reset did the work and the mask is inert. Either way we learn which lever
  the Phase B/C distillation teacher should be built from, instead of attributing +0.0058
  to the wrong mechanism.
change_vs_parent: 'EXACTLY ONE change off gru_v011: loss.mask_model -> null, which leaves
  soft_mask None in chunk_loss so every required row keeps unit weight. Unchanged: training.state_reset
  and inference.state_reset stay at 4000, aux weighted-MSE 0.05, EMA 0.999, architecture 2x128,
  seed 1337, 3-epoch cosine schedule. WHY IT MATTERS: every downstream decision depends on
  the attribution, especially whether the distillation teacher should be a pair of masked
  models (v011-like) or masked plus unmasked for ensemble diversity.'
data:
