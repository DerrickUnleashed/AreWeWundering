description: 'v064 with ONE change: training.epochs 8 -> 16. v064 is the project''s
  best model (full_valid_wp 0.689476, public 0.6604, the first submission to clear
  0.6600) and the first real win since the seven-run sweep. It doubled v059''s 3-epoch
  budget and gained +0.000801 (+5.0 sigma) locally, of which about half transferred
  publicly.'
hypothesis: Does the epoch axis keep paying? v062 established that stacking three
  step-size levers collapses into one quantity, and v064 established that a SINGLE
  axis pushed 8x beats all three stacked. The open question is whether training length
  has saturated at 8 or still has room at 16. Costs 212,144 steps against v064's 106,072,
  so roughly double again. If 16 lands near 0.6895 the axis has saturated and 8 epochs
  was the right budget; if it lands materially higher the axis was still the binding
  constraint at 8 and was never the model's ceiling.
change_vs_parent: 'vs v064: training.epochs 8 -> 16 (212,144 steps). Nothing else
  -- optim (lr 1e-3, wd 0.01, grad_clip 1.0), cosine schedule, features, 2x128 GRU
  with input_proj 64, loss, distillation, seed 1337 and state_reset all identical.
  Same 225,922 params.'
