description: v042 with training.state_reset 2000 -> 4000, so training and serving finally AGREE.
hypothesis: 'Every version from v021 has trained with state_reset=2000 and served with 4000, an accidental skew nobody intended. Measuring it showed serving at 4000 beats serving at 2000 by +0.001221, which is 7.7 sigma and the largest single effect we have measured in months. That raises a sharp question: is the gain from the LONGER horizon at serving, or from the train/serve MISMATCH? v042 is the mismatch arm and v047 is the matched arm at the same 4000 interval. If matched wins, the mismatch was luck and should be closed. If matched loses, the mismatch is a real effect worth keeping and pushing further (v048).'
change_vs_parent: training.state_reset 2000 -> 4000. inference.state_reset stays 4000, so this version trains and serves on the SAME interval for the first time in the project.
