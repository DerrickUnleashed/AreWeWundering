schema_version: 1
identity:
  model: gru
  version: v003
  parent: gru_v000
  status: running
description: 'TRAINING STABILITY: add a 0.05 |t|-weighted auxiliary MSE term and enable
  EMA weights.'
hypothesis: The weighted-Pearson gradient vanishes where the target variance collapses,
  so a clip-aware weighted MSE term should stabilise exactly the heavy tails that
  dominate the metric. EMA then averages away seed noise for free at inference, since
  it costs nothing per row.
change_vs_parent: loss.aux_mse_weight 0.0->0.05 and optim.ema_decay 0.0->0.999. Deliberately
  grouped as one 'training stability' hypothesis, so a win here is a win for the pair,
  not for either alone. Trained on all 10,607 sequences for 3 epochs, seed 1337, evaluated
  on the same fixed 200 validation sequences.
