description: v039 (our best at 0.6594) trained for 8 epochs instead of 3, keeping the two-member dozken teacher and distill_weight 2.0.
hypothesis: 'The two best public runs are v039 (better teacher, 0.6594) and v037 (8 epochs, 0.6592), and they are ORTHOGONAL: one changes who teaches, the other how long we train. Both ran at distill_weight 2.0, so the combination is untested. If schedule length and teacher quality attack the same ceiling they will not add; if they attack different error components they will, and the student sits 0.0008 above the local 0.6879 teacher so there is real gap to close.'
change_vs_parent: training.epochs 3 -> 8. Nothing else differs from v039.
