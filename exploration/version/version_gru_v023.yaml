description: 'Distilled student on dozken''s architecture at hidden 128 -- 225,922 params, 51.8% of his
  435,943-param teacher, against v022''s 73.8%. Same teacher, same loss, same schedule; the student size
  is the only change. Also the latency-safe size: v022 at 46.83 us/row already projects to 83% of the
  time budget, and this should roughly halve that.'
hypothesis: The distillation gain is COMPRESSION-DEPENDENT, and both data points say so. v017 was 61%
  of its teacher and landed 0.001880 ABOVE it. v022 is 74% of its teacher and landed 0.004940 BELOW it.
  More compression means more distillation regularisation, so a more compressed student should land closer
  to the teacher's 0.690168 -- or above it. If the hypothesis holds, v023 beats v022 while being materially
  cheaper to serve. If it fails, compression is not the axis and the remaining 0.0049 has to come from
  the teacher's training recipe instead.
change_vs_parent: hidden 160 -> 128 only (321,602 -> 225,922 params). Everything else identical to v022.
