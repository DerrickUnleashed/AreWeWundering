description: 'v031''s exact recipe with ONE change: hidden 128 -> 96, so 225,922 ->
  148,674 params, a 34% reduction. Every other scalar identical: distill_weight 2.0,
  input_proj 64, 3 epochs, same teacher, schedule, LR and seed.'
hypothesis: "THE ONLY CAPACITY DIRECTION THAT HAS EVER WORKED, and it has never been\
  \ tested past its current endpoint. Every capacity experiment in this project has\
  \ gone UP and every one has lost: head 192->384 -3.2 sigma, hidden 128->285 -13.7,\
  \ hidden 128->415 -21.7. We have never gone DOWN.\n\n  Going down has exactly one\
  \ precedent and it points this way. v022 (321,602 params) and v023 (225,922) shared\
  \ distill_weight 0.5 -- locally v022 was 0.000547 BETTER, and publicly v023 was\
  \ 0.0003 better while running 10% faster. So on the board that matters, smaller\
  \ was ahead, on a single submission each, which is weak evidence, but it is the\
  \ only direction with a positive sign and it also buys latency.\n\n  Prediction:\
  \ 96 units scores within noise of v031 locally, and if the public trend is real\
  \ it beats it while cutting per-row compute roughly 20%. A loss here would NOT be\
  \ surprising and would mean 128 is a genuine interior optimum, which is itself worth\
  \ knowing -- it would say the model is neither too big nor too small and the remaining\
  \ gap to the leader is not a capacity problem at all."
change_vs_parent: model.hidden 128 -> 96 only. Param count falls 225,922 -> 148,674,
  a 34% reduction, leaving 34.1% of the 435,943-param teacher.
